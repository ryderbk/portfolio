    <!-- OpenGraph -->

    <!-- Twitter Card -->

    <meta name="twitter:title" content="Bk’s Portfolio" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <script>
      // Prevent FOUC: Instantly restore compiled theme and CSS variables before React mounts
      (function() {
        try {
          var cssText = localStorage.getItem('portfolio-css-text');
          var cssClasses = localStorage.getItem('portfolio-css-classes');
          var cardStyle = localStorage.getItem('portfolio-card-style');
          
          if (cssText) document.documentElement.style.cssText = cssText.replace(/overflow(-[xy])?\s*:[^;]*;?/g, '');
          if (cssClasses) document.documentElement.className = cssClasses.split(/\s+/).filter(function (c) { return c && c.indexOf('lenis') !== 0; }).join(' ');
          if (cardStyle) document.documentElement.setAttribute('data-card-style', cardStyle);
        } catch (e) {
          console.error("Failed to restore initial theme", e);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
